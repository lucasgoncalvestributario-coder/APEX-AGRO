    <!-- Precarregamento imediato de todas as fotos em alta resolução para exibição instantânea -->
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" type="image/png">
    <link rel="preload" as="image" href="/hero-pulverizador-4k.webp" type="image/webp" media="(min-width: 1440px)" fetchpriority="high">
    <link rel="preload" as="image" href="/hero-pulverizador-2k.webp" type="image/webp" media="(min-width: 768px) and (max-width: 1439px)" fetchpriority="high">
    <link rel="preload" as="image" href="/hero-pulverizador.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high">

    <script>
      (function() {
        // Pré-carrega imediatamente todas as imagens em cache na mais alta qualidade
        const criticalImages = [
          '/logo.png',
          '/hero-pulverizador-4k.webp',
          '/hero-pulverizador-2k.webp',
          '/hero-pulverizador.webp',
          '/hero-pulverizador.png'
        ];
        criticalImages.forEach(function(src) {
          const img = new Image();
          img.fetchPriority = 'high';
          img.src = src;
        });
      })();
    </script>
